[project]
name = "dvq-bench"
version = "0.1.0"
description = "A benchmark for the design quality of AI-generated data visualizations, scored against a canon-grounded rubric."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "litellm>=1.51",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Rendering (D3 executes in headless Chromium; the one JS step in a Python harness).
render = ["playwright>=1.48"]
# Tracing/eval instrumentation (open-source, self-hostable).
trace = ["langfuse>=2.50"]
# Vals AI's own multi-provider gateway, as an alternative provider backend.
vals = ["model-library"]

[project.scripts]
dvq = "dvq.cli:app"

[tool.uv.sources]
model-library = { git = "https://github.com/vals-ai/model-library" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvq"]
